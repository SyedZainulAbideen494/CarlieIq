<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>ADAPT Pro - Pilot Screening (Practice)</title>
<style>
  :root{
    --bg-color:#0f0f0f;
    --hud-green:#00ff41;
    --hud-dim:#003b0f;
    --alert-red:#ff3333;
    --panel-bg:#1a1a1a;
    --text-main:#e0e0e0;
  }
  body{
    margin:0;background:#000;color:var(--text-main);
    font-family:'Consolas','Monaco','Courier New',monospace;
    height:100vh; height:100dvh; overflow:hidden; display:flex; justify-content:center; align-items:center;
    user-select:none; -webkit-tap-highlight-color: transparent;
  }
  #main-interface{
    display:flex; width:98vw; height:95vh; border:1px solid #333;
    box-shadow:0 0 50px rgba(0,255,65,.1); background:var(--panel-bg);
  }

  /* LEFT / TOP (Simulator) */
  #sim-view{flex:2; position:relative; background:#000; overflow:hidden; border-right:2px solid #333; cursor:none;}
  canvas{display:block; width:100%; height:100%}
  #hud-overlay{position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 50px rgba(0,0,0,.8)}
  .hud-line{position:absolute; background:rgba(0,255,65,.3)}
  .crosshair{position:absolute; top:50%; left:50%; width:20px; height:20px; transform:translate(-50%,-50%); border:1px solid rgba(0,255,65,.5)}

  /* MOBILE CONTROLS (Hidden on Desktop) */
  #mobile-ctrl-pad {
    display: none;
    position: absolute;
    bottom: 20px;
    left: 20px;
    flex-direction: column;
    gap: 15px;
    pointer-events: auto;
    z-index: 10;
  }
  .ctrl-btn {
    width: 70px; height: 70px;
    background: rgba(255,255,255,0.1);
    border: 2px solid var(--hud-green);
    border-radius: 50%;
    color: var(--hud-green);
    font-size: 30px;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(5px);
    touch-action: none;
  }

  /* RIGHT / BOTTOM (System/Quiz) */
  #sys-view{flex:1; padding:15px; display:flex; flex-direction:column; background:#222; border-left:1px solid #000; overflow-y: auto;}
  .panel-title{color:var(--hud-green); border-bottom:1px solid var(--hud-dim); padding-bottom:5px; margin-bottom:10px; font-size:12px; letter-spacing:2px}
  .stats-grid{display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:15px}
  .stat-box{background:#111; padding:8px; border:1px solid #333}
  .stat-label{font-size:9px; color:#777; display:block}
  .stat-val{font-size:16px; color:var(--hud-green); font-weight:bold}
  
  #q-module{flex-grow:1; display:flex; flex-direction:column; background:#151515; border:1px solid #333; padding:12px; position:relative}
  #timer-bar{height:6px; width:100%; background:#333; margin-bottom:15px; border-radius: 3px; overflow: hidden;}
  #timer-fill{height:100%; width:100%; background:var(--hud-green); transition:width .08s linear}
  #q-display{font-size:20px; text-align:center; margin-bottom:15px; font-weight:bold; color:#fff; min-height:24px}
  .btn-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .ans-btn{background:#222; border:1px solid #444; color:#fff; padding:18px 10px; font-family:inherit; font-size:18px; cursor:pointer; touch-action: manipulation;}

  /* OVERLAY */
  #overlay{
    position:absolute; inset:0; background:rgba(0,0,0,.92); z-index:100;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding: 20px;
  }
  .big-btn{
    background:transparent; border:2px solid var(--hud-green); color:var(--hud-green); padding:15px 40px;
    font-size:20px; font-family:inherit; font-weight:bold; cursor:pointer; margin-top:24px; text-transform:uppercase;
  }

  /* RESPONSIVE BREAKPOINT */
  @media (max-width: 850px) {
    #main-interface { flex-direction: column; width: 100vw; height: 100vh; }
    #sim-view { flex: 1.2; border-right: none; border-bottom: 2px solid #333; }
    #sys-view { flex: 1.5; }
    #mobile-ctrl-pad { display: flex; }
    .btn-grid { gap: 8px; }
    .ans-btn { padding: 20px 10px; font-size: 20px; }
    .panel-title { margin-top: 5px; }
    #controls-hint { gap: 15px !important; }
    #controls-hint div div:first-child { font-size: 20px !important; }
  }

  table{border-collapse:collapse;width:280px;margin-top:18px;color:#ccc}
  td{padding:8px;border-bottom:1px solid #333}
  td:last-child{text-align:right;color:var(--hud-green)}
  #countdown{font-size:56px;color:#fff;margin-top:8px;letter-spacing:8px}
</style>
</head>
<body>

<div id="overlay">
  <h1 style="color:white;margin-bottom:5px; font-size: 24px;">FLIGHT APTITUDE</h1>
  <div style="color:var(--hud-green);font-size:10px;letter-spacing:3px;margin-bottom:18px;">SYSTEM READY</div>

  <div id="controls-hint" style="display:flex;gap:30px;text-align:center;font-size:12px;color:#888;margin-bottom:8px;">
    <div><div style="font-size:24px;color:white;margin-bottom:5px;">🚀</div><div>UP / DOWN</div><div style="font-size:9px;">STABILIZE</div></div>
    <div><div style="font-size:24px;color:white;margin-bottom:5px;">🧠</div><div>1–4</div><div style="font-size:9px;">SOLVE</div></div>
  </div>

  <div id="countdown" style="display:none;">3</div>

  <div id="results" style="display:none;">
    <table>
      <tr><td>Time</td><td id="r-time">0s</td></tr>
      <tr><td>Accuracy</td><td id="r-acc">0%</td></tr>
      <tr><td>Stability</td><td id="r-stab">0</td></tr>
      <tr><td style="color:white;font-weight:bold;">SCORE</td><td id="r-score">0</td></tr>
    </table>
  </div>

  <button class="big-btn" id="startBtn">INITIATE</button>
</div>

<div id="main-interface">
  <div id="sim-view">
    <canvas id="simCanvas"></canvas>
    
    <div id="mobile-ctrl-pad">
      <div class="ctrl-btn" id="touch-up">▲</div>
      <div class="ctrl-btn" id="touch-down">▼</div>
    </div>

    <div id="hud-overlay">
      <div class="crosshair"></div>
      <div style="position:absolute;bottom:10px;left:10px;color:var(--hud-green);font-size:10px;" id="hud-vel">VEL: 0</div>
      <div style="position:absolute;bottom:10px;right:10px;color:var(--hud-green);font-size:10px;" id="hud-diff">DIFF: 1.00</div>
    </div>
  </div>

  <div id="sys-view">
    <div class="stats-grid">
      <div class="stat-box"><span class="stat-label">TIME</span><span class="stat-val" id="ui-time">0.0</span></div>
      <div class="stat-box"><span class="stat-label">STABILITY</span><span class="stat-val" id="ui-stab">100</span></div>
    </div>

    <div id="q-module">
      <div id="timer-bar"><div id="timer-fill"></div></div>
      <div id="q-display">WAITING...</div>
      <div class="btn-grid">
        <button class="ans-btn" id="btn-0">1</button>
        <button class="ans-btn" id="btn-1">2</button>
        <button class="ans-btn" id="btn-2">3</button>
        <button class="ans-btn" id="btn-3">4</button>
      </div>
      <div style="margin-top:10px;text-align:center;font-size:9px;color:#555; display: flex; justify-content: space-around;">
        <span>ACC: <span id="ui-acc" style="color:#aaa">100%</span></span>
        <span>Q: <span id="ui-q" style="color:#aaa">0</span></span>
        <span onclick="app.togglePause()" style="text-decoration: underline; cursor: pointer;">PAUSE (P)</span>
      </div>
    </div>
  </div>
</div>

<script>
/* --------------------------- MAIN APP --------------------------- */
const app = {
  running:false, paused:false, startTime:0,
  sim:null, quiz:null, raf:null,
  stabilityScore:100, 
  diffFactor:1, 
  correctWeight:50, timeW:0.4, accW:0.4, speedW:0.2,

  boot(){
    document.getElementById('startBtn').onclick = ()=> this.startSequence();
    for(let i=0;i<4;i++){
      const btn = document.getElementById(`btn-${i}`);
      btn.onclick = (e)=> { e.preventDefault(); this.answer(i); };
    }
    window.addEventListener('keydown', (e)=>{
      if(e.key.toLowerCase()==='p') if(this.running) this.togglePause();
    });
    window.addEventListener('resize', ()=> { if(this.sim) this.sim.resize(); });
    this.setupTouchControls();
  },

  setupTouchControls() {
    const u = document.getElementById('touch-up');
    const d = document.getElementById('touch-down');
    const handle = (dir, state) => { if(this.sim) this.sim.keys[dir] = state; };
    
    u.ontouchstart = (e) => { e.preventDefault(); handle('u', 1); };
    u.ontouchend = (e) => { e.preventDefault(); handle('u', 0); };
    d.ontouchstart = (e) => { e.preventDefault(); handle('d', 1); };
    d.ontouchend = (e) => { e.preventDefault(); handle('d', 0); };
  },

  async startSequence(){
    const overlay = document.getElementById('overlay');
    const results = document.getElementById('results');
    const cd = document.getElementById('countdown');
    results.style.display = 'none';
    cd.style.display = 'block';
    document.getElementById('startBtn').style.display = 'none';
    cd.textContent = '3'; await this.wait(600);
    cd.textContent = '2'; await this.wait(600);
    cd.textContent = '1'; await this.wait(600);
    cd.textContent = 'GO'; await this.wait(300);
    overlay.style.display = 'none';
    cd.style.display = 'none';
    this.start();
  },

  wait(ms){ return new Promise(r=>setTimeout(r,ms)); },

  start(){
    this.running = true; this.paused = false;
    this.startTime = Date.now();
    this.stabilityScore = 100;
    this.diffFactor = 1;
    this.sim = new Simulator();
    this.quiz = new QuizModule();

    cancelAnimationFrame(this.raf);
    const loop = ()=>{
      if(!this.running) return;
      if(!this.paused){
        this.sim.update();
        this.quiz.update();
        document.getElementById('ui-time').innerText = ((Date.now()-this.startTime)/1000).toFixed(1);
        const dev = Math.abs(this.sim.pos.y - this.sim.h/2);
        const vPenalty = Math.min(1, Math.abs(this.sim.vel.y)/8);
        this.stabilityScore = Math.max(0, Math.min(100, this.stabilityScore*0.995 + (100 - (dev/(this.sim.h/2))*70 - vPenalty*30)*0.005));
        document.getElementById('ui-stab').innerText = Math.round(this.stabilityScore);
        document.getElementById('hud-vel').innerText = 'VEL: ' + (Math.hypot(this.sim.vel.x,this.sim.vel.y)).toFixed(2);
        document.getElementById('hud-diff').innerText = 'DIFF: ' + this.diffFactor.toFixed(2);
        const t = (Date.now()-this.startTime)/1000;
        this.diffFactor = 1 + Math.min(1.2, t/50);
        this.sim.setDifficulty(this.diffFactor);
        this.quiz.setDifficulty(this.diffFactor, this.quiz.getStats().acc);
      }
      this.raf = requestAnimationFrame(loop);
    };
    loop();
  },

  stop(reason){
    this.running = false;
    cancelAnimationFrame(this.raf);
    const time = (Date.now() - this.startTime)/1000;
    const {acc, react} = this.quiz.getStats();
    const score = Math.floor((time*40) + (acc*4) + (this.quiz.correct*25) + (this.stabilityScore*0.5));
    document.getElementById('r-time').innerText = time.toFixed(1)+'s';
    document.getElementById('r-acc').innerText  = acc + '%';
    document.getElementById('r-stab').innerText = Math.round(this.stabilityScore);
    document.getElementById('r-score').innerText= score;
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('results').style.display = 'block';
    document.getElementById('startBtn').textContent = 'RESTART';
    document.getElementById('startBtn').style.display = 'inline-block';
  },

  togglePause(){
    this.paused = !this.paused;
    const overlay = document.getElementById('overlay');
    if(this.paused){
      document.getElementById('results').style.display = 'none';
      overlay.style.display = 'flex';
      document.getElementById('countdown').style.display = 'none';
      document.getElementById('startBtn').textContent = 'RESUME';
      document.getElementById('startBtn').style.display = 'inline-block';
    }else{
      overlay.style.display = 'none';
      document.getElementById('startBtn').style.display = 'none';
    }
  },

  answer(idx){ if(this.running && !this.paused) this.quiz.check(idx); }
};

/* --------------------------- SIMULATOR --------------------------- */
class Simulator{
  constructor(){
    this.cvs = document.getElementById('simCanvas');
    this.ctx = this.cvs.getContext('2d');
    this.resize();
    this.pos = {x: 60, y: this.h/2};
    this.vel = {x: 0, y: 0};
    this.friction = 0.92;
    this.wallSpeed = 5;
    this.spawnEvery = 90;
    this.gap = 180;
    this.walls = [];
    this.particles = [];
    this.stars = [];
    this.frameCount = 0;
    this.keys = {u:0,d:0};
    window.onkeydown = (e)=> this.handleKey(e,1);
    window.onkeyup   = (e)=> this.handleKey(e,0);
    for(let i=0;i<30;i++) this.stars.push({x: Math.random()*this.w, y: Math.random()*this.h, s: Math.random()*2});
  }
  handleKey(e,state){
    const k = e.key.toLowerCase();
    if(k==='w'||k==='arrowup') this.keys.u = state;
    if(k==='s'||k==='arrowdown') this.keys.d = state;
    if(state===1 && ['1','2','3','4'].includes(k)) app.answer(parseInt(k)-1);
  }
  resize(){
    const rect = this.cvs.parentElement.getBoundingClientRect();
    this.w = this.cvs.width  = rect.width;
    this.h = this.cvs.height = rect.height;
  }
  setDifficulty(mult){
    this.wallSpeed = 5 * mult;
    this.gap = Math.max(110, 180 - (mult-1)*70);
    this.spawnEvery = Math.max(50, 90 - Math.floor((mult-1)*40));
  }
  update(){
    this.frameCount++;
    if(this.keys.u) this.vel.y -= 0.7;
    if(this.keys.d) this.vel.y += 0.7;
    this.vel.y *= this.friction;
    this.pos.y += this.vel.y;
    if(this.pos.y < 0 || this.pos.y > this.h-15) return app.stop('CRASH');
    if(this.frameCount % this.spawnEvery === 0){
      const y = Math.random()*(this.h - this.gap);
      this.walls.push({x:this.w, y:0, w:30, h:y}, {x:this.w, y:y+this.gap, w:30, h:this.h-(y+this.gap)});
    }
    this.walls.forEach(w=> w.x -= this.wallSpeed);
    this.walls = this.walls.filter(w=> w.x + w.w > 0);
    const pRect = {x:this.pos.x+5, y:this.pos.y+5, w:25, h:8};
    for(const w of this.walls){
      if(pRect.x < w.x+w.w && pRect.x+pRect.w > w.x && pRect.y < w.y+w.h && pRect.y+pRect.h > w.y) return app.stop('CRASH');
    }
    this.draw();
  }
  draw(){
    const c=this.ctx; c.clearRect(0,0,this.w,this.h);
    c.fillStyle='#444'; this.stars.forEach(s=>{ s.x-=s.s; if(s.x<0)s.x=this.w; c.fillRect(s.x,s.y,s.s,s.s);});
    c.save(); c.translate(this.pos.x+15, this.pos.y+7); c.rotate(this.vel.y*0.05);
    c.fillStyle='#fff'; c.beginPath(); c.moveTo(15,0); c.lineTo(-10,8); c.lineTo(-10,-8); c.fill();
    c.restore();
    c.fillStyle='#333'; c.strokeStyle=varProp('--hud-green'); 
    this.walls.forEach(w=>{ c.fillRect(w.x,w.y,w.w,w.h); c.strokeRect(w.x,w.y,w.w,w.h); });
  }
}
function varProp(name){ return getComputedStyle(document.documentElement).getPropertyValue(name); }

/* --------------------------- QUIZ --------------------------- */
class QuizModule{
  constructor(){
    this.correct=0; this.total=0; this.reactionSum=0;
    this.timerMax = 8000; this.minTimer = 4000;
    this.qStart=0; this.currentAns=null; this.opts=[];
    this.next();
  }
  setDifficulty(mult, accuracy){
    const accProtect = Math.max(0.7, Math.min(1.1, (accuracy||100)/100));
    this.timerMax = Math.round(Math.max(this.minTimer, 8000 / (1 + (mult-1)*0.7) * accProtect));
  }
  genQuestion(){
    const type = this.total % 3;
    if(type===0){
      const n1 = Math.floor(Math.random()*15)+5, n2 = Math.floor(Math.random()*15)+2;
      return Math.random()>0.5 ? {txt:`${n1}+${n2}`, ans:n1+n2} : {txt:`${n1}-${n2}`, ans:n1-n2};
    } else if(type===1){
      const a=Math.floor(Math.random()*50), b=Math.floor(Math.random()*50), c=Math.floor(Math.random()*50);
      return {txt:`MAX[${a},${b},${c}]`, ans:Math.max(a,b,c)};
    } else {
      const s=Math.floor(Math.random()*10), d=Math.floor(Math.random()*5)+2;
      return {txt:`${s},${s+d},${s+d*2},?`, ans:s+d*3};
    }
  }
  next(){
    this.qStart = Date.now();
    const q = this.genQuestion();
    this.currentAns = q.ans;
    let o = [q.ans];
    while(o.length<4){
      let f = q.ans + (Math.floor(Math.random()*15)-7);
      if(!o.includes(f)) o.push(f);
    }
    this.opts = o.sort(()=>Math.random()-0.5);
    document.getElementById('q-display').innerText = q.txt;
    this.opts.forEach((v,i)=>{
      const b=document.getElementById(`btn-${i}`);
      b.innerText=v; b.style.background='#222'; b.style.borderColor='#444';
    });
  }
  update(){
    const el = Date.now()-this.qStart;
    const pct = Math.max(0, 100 - (el/this.timerMax)*100);
    document.getElementById('timer-fill').style.width = pct+'%';
    document.getElementById('timer-fill').style.background = pct<30?'#f33':'#0f4';
    if(el>this.timerMax) this.check(-1);
  }
  check(idx){
    this.total++;
    let win = (idx!==-1 && this.opts[idx]===this.currentAns);
    if(win){ this.correct++; this.reactionSum+=(Date.now()-this.qStart); }
    else this.reactionSum+=this.timerMax;
    if(idx!==-1){
      const b=document.getElementById(`btn-${idx}`);
      b.style.background = win?'#050':'#500';
    }
    document.getElementById('ui-acc').innerText = Math.round((this.correct/this.total)*100)+'%';
    document.getElementById('ui-q').innerText = this.total;
    setTimeout(()=>this.next(), 200);
  }
  getStats(){
    return {acc: this.total?Math.round((this.correct/this.total)*100):100, react: this.total?Math.round(this.reactionSum/this.total):0};
  }
}

app.boot();
</script>
</body>
</html>
